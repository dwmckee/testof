<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demonstration Tests</title>
    <script src="testof.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <script>
      function array_equals(a1, a2) {
	  return a1.length === a2.length &&
	      a1.every((val, idx) => { return val === a2[idx]; });
      }

      let failures = 0;
      
      // Check result with default comparison; fail
      failures += new TestOf("String toUpperCase")
    .Subprogram((s) => {return s.toUpperCase();}, null)
    .Passed("hello")
    .Should(Return, "HELLO")
    .Log().HtmlElement().Fail;

      // Check result with custom comparison; fail
      failures += new TestOf("Default sort is numeric")
    .Subprogram((a) => { return a.sort(); }, null )
    .Passed([2, 3, 5, 7, 11, 13, 17, 19, 23])
    .Should(Return, [2, 3, 5, 7, 11, 13, 17, 19, 23], cmp = array_equals)
    .Log().HtmlElement().Fail;
      
      // Check result with custom comparison; pass
      failures += new TestOf("Default sort is lexical")
    .Subprogram((a) => { return a.sort(); }, null)
    .Passed([2, 3, 5, 7, 11, 13, 17, 19, 23])
    .Should(Return, [11, 13, 17, 19, 2, 23, 3, 5, 7], cmp = array_equals)
    .Log().HtmlElement().Fail;

      // Object property: pass
      failures += new TestOf("Array initial length")
    .ByDefault([])
    .Should(HaveProperty, "length", 0)
    .Log().HtmlElement().Fail;

      // Object property: fail
      failures += new TestOf("Object member value")
    .ByDefault({a: [1, 2]})
    .Should(HaveProperty, "a", [2, 1])
    .Log().HtmlElement().Fail;

      // Exception test: pass
      failures += new TestOf("JSON.parse invalid input")
    .Subprogram(JSON.parse)
    .Passed("{ invalid json }")
    .Should(Throw, SyntaxError)
    .Log().HtmlElement().Fail;

      // Exception test: fail
      failures += new TestOf("Math.sqrt no throw")
    .Subprogram(Math.sqrt)
    .Passed(16)
    .Should(Throw, Error)
    .Log().HtmlElement().Fail;

      const results_message = failures
	    ? `${failures} test${failures > 1 ? "s" : ""} failed`
	    : `All tests passed`;
      console.log(results_message);
      const result_tag = document.createElement('p');
      result_tag.innerHTML = results_message;
      document.body.append(result_tag);
      
    </script>

    <!-- Run the script -->
    
  </body>
</html>
